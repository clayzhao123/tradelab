<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" role="img" aria-labelledby="title description">
  <title id="title">How market information reaches the dashboard</title>
  <desc id="description">The real provider may serve cached or simulated fallback data if upstream access fails.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#69b7ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56d4ae"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bb9cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f4bf68"/>
    </marker>
  </defs>
  <rect width="960" height="364" rx="16" fill="#0b1220"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="43" fill="#e8eff7" font-size="24" text-anchor="start" font-weight="600">How market information reaches the dashboard</text>
    <text x="30" y="72" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">The real provider may serve cached or simulated fallback data if upstream access fails.</text>
    <rect x="30" y="111" width="215" height="120" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="127" width="4" height="88" rx="2" fill="#69b7ff"/>
    <text x="48" y="142" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Real market provider</text>
    <text x="48" y="169" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">OKX public endpoints</text>
    <text x="48" y="192" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Cached real data</text>
    <text x="48" y="215" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Mock fallback on failure</text>
    <rect x="30" y="249" width="215" height="84" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="265" width="4" height="52" rx="2" fill="#bb9cff"/>
    <text x="48" y="280" fill="#bb9cff" font-size="18" text-anchor="start" font-weight="600">Mock provider</text>
    <text x="48" y="307" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Local demonstration data</text>
    <rect x="321" y="169" width="250" height="132" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="321" y="185" width="4" height="100" rx="2" fill="#69b7ff"/>
    <text x="339" y="200" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Backend market module</text>
    <text x="339" y="227" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Quotes and candlesticks</text>
    <text x="339" y="250" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Watchlist / scanning</text>
    <text x="339" y="273" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">REST + WebSocket</text>
    <rect x="660" y="169" width="270" height="132" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="660" y="185" width="4" height="100" rx="2" fill="#56d4ae"/>
    <text x="678" y="200" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Dashboard</text>
    <text x="678" y="227" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Chart and watchlist</text>
    <text x="678" y="250" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Scan results</text>
    <text x="678" y="273" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Check the data source</text>
    <path d="M245 164 H282 V207 H321" fill="none" stroke="#69b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M245 290 H282 V265 H321" fill="none" stroke="#bb9cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <path d="M571 234 H660" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
</svg>
