<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title description">
  <title id="title">Place and inspect a simulated order</title>
  <desc id="description">A paper-trading workflow. Order states and account balances are maintained by the backend.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#69b7ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56d4ae"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bb9cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f4bf68"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="16" fill="#0b1220"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="43" fill="#e8eff7" font-size="24" text-anchor="start" font-weight="600">Place and inspect a simulated order</text>
    <text x="30" y="72" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">A paper-trading workflow. Order states and account balances are maintained by the backend.</text>
    <rect x="30" y="116" width="200" height="103" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="132" width="4" height="71" rx="2" fill="#69b7ff"/>
    <text x="48" y="147" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Paper order</text>
    <text x="48" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Buy / sell</text>
    <text x="48" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Market / limit</text>
    <rect x="292" y="116" width="205" height="103" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="292" y="132" width="4" height="71" rx="2" fill="#69b7ff"/>
    <text x="310" y="147" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Risk checks</text>
    <text x="310" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Cash, exposure</text>
    <text x="310" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Configured risk limits</text>
    <rect x="559" y="116" width="180" height="103" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="559" y="132" width="4" height="71" rx="2" fill="#56d4ae"/>
    <text x="577" y="147" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Fill simulation</text>
    <text x="577" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Fill quantity</text>
    <text x="577" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Price and status</text>
    <rect x="801" y="116" width="129" height="103" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="801" y="132" width="4" height="71" rx="2" fill="#56d4ae"/>
    <text x="819" y="147" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Account</text>
    <text x="819" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Positions</text>
    <text x="819" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Cash / P&amp;L</text>
    <rect x="292" y="275" width="205" height="80" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="292" y="291" width="4" height="48" rx="2" fill="#f4bf68"/>
    <text x="310" y="306" fill="#f4bf68" font-size="18" text-anchor="start" font-weight="600">Rejected order</text>
    <text x="310" y="333" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Keep the risk reason</text>
    <rect x="559" y="263" width="371" height="103" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="559" y="279" width="4" height="71" rx="2" fill="#56d4ae"/>
    <text x="577" y="294" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Orders, fills and history</text>
    <text x="577" y="321" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Inspect status changes and simulated fills</text>
    <text x="577" y="344" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">No real exchange order is submitted</text>
    <path d="M230 167 H292" fill="none" stroke="#69b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M497 167 H559" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M739 167 H801" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M394 219 V275" fill="none" stroke="#f4bf68" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <text x="405" y="251" fill="#f4bf68" font-size="13" text-anchor="start" font-weight="400">rejected</text>
    <path d="M649 219 V263" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M867 219 V263" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
</svg>
