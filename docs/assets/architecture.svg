<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-labelledby="title description">
  <title id="title">Current architecture and storage boundaries</title>
  <desc id="description">The frontend/ and backend/ npm workspaces are the active application.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#69b7ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56d4ae"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bb9cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f4bf68"/>
    </marker>
  </defs>
  <rect width="960" height="566" rx="16" fill="#0b1220"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="43" fill="#e8eff7" font-size="24" text-anchor="start" font-weight="600">Current architecture and storage boundaries</text>
    <text x="30" y="72" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">The frontend/ and backend/ npm workspaces are the active application.</text>
    <rect x="315" y="109" width="330" height="90" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="315" y="125" width="4" height="58" rx="2" fill="#69b7ff"/>
    <text x="333" y="140" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">React frontend</text>
    <text x="333" y="167" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Dashboard, orders, strategy, backtest</text>
    <rect x="315" y="257" width="330" height="90" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="315" y="273" width="4" height="58" rx="2" fill="#69b7ff"/>
    <text x="333" y="288" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Fastify backend</text>
    <text x="333" y="315" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Typed REST API + WebSocket</text>
    <rect x="30" y="416" width="280" height="118" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="432" width="4" height="86" rx="2" fill="#69b7ff"/>
    <text x="48" y="447" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Market providers</text>
    <text x="48" y="474" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">OKX public data</text>
    <text x="48" y="497" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Cache / mock fallback</text>
    <rect x="340" y="416" width="280" height="118" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="340" y="432" width="4" height="86" rx="2" fill="#f4bf68"/>
    <text x="358" y="447" fill="#f4bf68" font-size="18" text-anchor="start" font-weight="600">Runtime memory</text>
    <text x="358" y="474" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Orders, fills, account</text>
    <text x="358" y="497" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Runs and risk/history state</text>
    <rect x="650" y="416" width="280" height="118" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="650" y="432" width="4" height="86" rx="2" fill="#56d4ae"/>
    <text x="668" y="447" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Persistence repositories</text>
    <text x="668" y="474" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Strategies, AI settings, backtests</text>
    <text x="668" y="497" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">JSON files or optional PostgreSQL</text>
    <path d="M462 199 V257" fill="none" stroke="#69b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="330" y="230" fill="#69b7ff" font-size="13" text-anchor="start" font-weight="400">REST requests</text>
    <path d="M501 257 V199" fill="none" stroke="#bb9cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="516" y="230" fill="#bb9cff" font-size="13" text-anchor="start" font-weight="400">WS events</text>
    <path d="M365 347 V376 H170 V416" fill="none" stroke="#69b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M480 347 V416" fill="none" stroke="#f4bf68" stroke-width="2" marker-end="url(#arrow-amber)"/>
    <path d="M595 347 V376 H790 V416" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
</svg>
