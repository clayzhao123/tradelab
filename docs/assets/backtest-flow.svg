<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="title description">
  <title id="title">Backtest a configuration on historical candles</title>
  <desc id="description">Process diagram, not a performance chart. No invented returns are shown.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#69b7ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#56d4ae"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#bb9cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f4bf68"/>
    </marker>
  </defs>
  <rect width="960" height="356" rx="16" fill="#0b1220"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="30" y="43" fill="#e8eff7" font-size="24" text-anchor="start" font-weight="600">Backtest a configuration on historical candles</text>
    <text x="30" y="72" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Process diagram, not a performance chart. No invented returns are shown.</text>
    <rect x="30" y="116" width="220" height="96" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="132" width="4" height="64" rx="2" fill="#69b7ff"/>
    <text x="48" y="147" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Strategy &amp; settings</text>
    <text x="48" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Symbols, timeframe</text>
    <text x="48" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Lookback, decision mode</text>
    <rect x="30" y="240" width="220" height="86" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="30" y="256" width="4" height="54" rx="2" fill="#bb9cff"/>
    <text x="48" y="271" fill="#bb9cff" font-size="18" text-anchor="start" font-weight="600">Historical candles</text>
    <text x="48" y="298" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">From the market provider</text>
    <rect x="310" y="154" width="246" height="148" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="310" y="170" width="4" height="116" rx="2" fill="#69b7ff"/>
    <text x="328" y="185" fill="#69b7ff" font-size="18" text-anchor="start" font-weight="600">Backtest engine</text>
    <text x="328" y="212" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Compute composite signal</text>
    <text x="328" y="235" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Derive decision thresholds</text>
    <text x="328" y="258" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Simulate buys and sells</text>
    <rect x="632" y="116" width="298" height="96" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="632" y="132" width="4" height="64" rx="2" fill="#56d4ae"/>
    <text x="650" y="147" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Per-symbol results</text>
    <text x="650" y="174" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Return, drawdown, trades</text>
    <text x="650" y="197" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Exposure and contribution</text>
    <rect x="632" y="240" width="298" height="86" rx="12" fill="#131f32" stroke="#334a65"/>
    <rect x="632" y="256" width="4" height="54" rx="2" fill="#56d4ae"/>
    <text x="650" y="271" fill="#56d4ae" font-size="18" text-anchor="start" font-weight="600">Portfolio results</text>
    <text x="650" y="298" fill="#a8bbcf" font-size="14" text-anchor="start" font-weight="400">Equity curve and summary</text>
    <path d="M250 164 H280 V198 H310" fill="none" stroke="#69b7ff" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <path d="M250 283 H280 V259 H310" fill="none" stroke="#bb9cff" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <path d="M556 202 H594 V164 H632" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
    <path d="M556 263 H594 V283 H632" fill="none" stroke="#56d4ae" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
</svg>
